                  - listitem [ref=e1800]:
                    - generic [ref=e1801]: "9"
                    - paragraph [ref=e1803]:
                      - text: The first concerns how close together prime numbers can occur, however far along the number line you go. For more than a decade, the best known result established that infinitely many pairs of primes are at most 246 apart.
                      - link "Julia Stadlmann⁠ (เปิดในหน้าต่างใหม่)" [ref=e1804] [cursor=pointer]:
                        - /url: https://math.illinois.edu/directory/profile/stadl
