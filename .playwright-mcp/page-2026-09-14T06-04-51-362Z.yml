                        - text: ⁠
                        - generic [ref=e1806]: (เปิดในหน้าต่างใหม่)
                      - text: "recently improved that bound to 240. Astra helped establish a stronger bound of 186, showing that infinitely many pairs occur within this smaller distance. Short prime gaps:"
                      - link "Proof⁠ (เปิดในหน้าต่างใหม่)" [ref=e1807] [cursor=pointer]:
                        - /url: https://cdn.openai.com/pdf/51126fac-1b68-4128-9666-c908bcc16033/short_gaps.pdf
                        - text: Proof⁠
                        - generic [ref=e1808]: (เปิดในหน้าต่างใหม่)
                      - text: and
                      - link "supporting research⁠ (เปิดในหน้าต่างใหม่)" [ref=e1809] [cursor=pointer]:
                        - /url: https://cdn.openai.com/pdf/51126fac-1b68-4128-9666-c908bcc16033/short_gaps_abridged_cot.pdf
                        - text: supporting research⁠
                        - generic [ref=e1810]: (เปิดในหน้าต่างใหม่)
                      - text: .
                      - link "เลื่อนไปที่แหล่งอ้างอิง 9" [ref=e1812] [cursor=pointer]:
