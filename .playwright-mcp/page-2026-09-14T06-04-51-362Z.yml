                  - paragraph [ref=e92]:
                    - text: GPT‑6 Astra เป็นผลจากการผสานงานวิจัยที่สั่งสมมาหลายปีเข้ากับการลงทุนครั้งสำคัญในด้านการฝึกล่วงหน้า การเรียนรู้แบบเสริมกำลัง และการปรับโมเดลให้สอดคล้องกับเป้าหมาย Astra มีความสามารถล้ำสมัยที่สุดในด้านการใช้งานคอมพิวเตอร์ การท่องเว็บ วิศวกรรมซอฟต์แวร์ ความมั่นคงปลอดภัยทางไซเบอร์ วิทยาศาสตร์ และงานระดับมืออาชีพ Astra ทำคะแนนจนแตะเพดานของ FrontierMath Tier 4 ด้วยคะแนน 98% โดยก่อนหน้านี้ได้ช่วย
                    - link "แก้ปัญหาเปิดที่ค้างคามานาน⁠" [ref=e93] [cursor=pointer]:
